# SAM deploy configuration
# Prod:  cd infrastructure && sam build && sam deploy
# Dev:   cd infrastructure && sam build && sam deploy --config-env dev
# Each environment is its own stack. Never deploy Stage=dev into the prod stack:
# changing Stage renames the tables and CloudFormation would replace them.
# Parameters not listed here (e.g. AlertEmail, GoogleAqKeyParam) keep their previously
# deployed values; pass them once with --parameter-overrides to set them.

version = 0.1

[default.deploy.parameters]
stack_name = "breathesafe-campus"
resolve_s3 = true
s3_prefix = "breathesafe-campus"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = "DataMode=live Stage=prod"

[dev.deploy.parameters]
stack_name = "breathesafe-campus-dev"
resolve_s3 = true
s3_prefix = "breathesafe-campus-dev"
region = "ap-south-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
parameter_overrides = "DataMode=live Stage=dev"
