AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BreatheSafe - air-quality decisions for anyone in India

Globals:
  Function:
    Runtime: nodejs22.x
    # API Gateway gives up at 29s; keep every function well below that.
    Timeout: 20
    MemorySize: 256
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        AQI_TABLE_NAME: !Ref AQIReadingsTable
        ALERTS_TABLE_NAME: !Ref AlertsDecisionsTable
        DATA_MODE: !Ref DataMode
        DEMO_SCENARIOS_ENABLED: !Ref DemoScenariosEnabled
        RULES_TABLE_NAME: !Ref RulesConfigTable
        EVENT_BUS_NAME: !Ref EventBus
        STAGE: !Ref Stage
        GOOGLE_AQ_KEY_PARAM: !Ref GoogleAqKeyParam

Parameters:
  DataMode:
    Type: String
    Default: demo
    AllowedValues:
      - live
      - demo
    Description: "'live': Google Air Quality API (India's National AQI) for each area; 'demo': labelled fixtures for every request"
  DemoScenariosEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: In live mode, allow presenter requests (?scenario=) to use labelled demo fixtures
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
  AlertEmail:
    Type: String
    Default: ''
    Description: Email subscribed to alert notifications (SNS). Leave empty to disable email delivery.
  PublicSiteUrl:
    Type: String
    Default: ''
    Description: Public URL of the notice page, included in alert emails (e.g. https://example.com/notice). Optional.
  NoticeAIEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Polish notice drafts with the Gemini API (falls back to reviewed templates on any error)
  ExplainAIEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Write plain-language explanations with the Gemini API (guardrail-checked; falls back to a deterministic explanation)
  SesFromEmail:
    Type: String
    Default: ''
    Description: Optional. Verified SES email identity for Cognito emails (sign-up codes, password resets). Empty uses Cognito's built-in email.
  GoogleAqKeyParam:
    Type: String
    Default: /breathesafe/google-air-quality-key
    Description: SSM SecureString parameter holding the Google Air Quality API key
  GeminiModel:
    Type: String
    Default: gemini-flash-lite-latest
    Description: Gemini model used for notice drafts and explanations
  GeminiApiKeyParam:
    Type: String
    Default: /breathesafe/gemini-api-key
    Description: SSM SecureString parameter holding the Gemini API key

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  UseSesEmail: !Not [!Equals [!Ref SesFromEmail, '']]

Resources:

  # ============================================
  # Cognito User Pool
  # ============================================
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub breathesafe-users-${Stage}
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      # Two-step verification with an authenticator app, chosen by each user.
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      # Cognito's built-in email allows ~50 emails a day. Set SesFromEmail (a
      # verified SES identity, with SES production access) to send through SES.
      EmailConfiguration: !If
        - UseSesEmail
        - EmailSendingAccount: DEVELOPER
          From: !Sub BreatheSafe <${SesFromEmail}>
          SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesFromEmail}
        - !Ref AWS::NoValue
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: institution
          AttributeDataType: String
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub breathesafe-web-${Stage}
      UserPoolId: !Ref UserPool
      # SRP only: the browser proves it knows the password without sending it.
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      # Sign-out revokes the refresh token (RevokeToken).
      EnableTokenRevocation: true
      # Attributes a user may set themselves (sign-up needs email). custom:role
      # is excluded so nobody can self-assign a role.
      WriteAttributes:
        - email
        - name
        - custom:institution
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ============================================
  # API Gateway
  # ============================================
  BreatheSafeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub breathesafe-api-${Stage}
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,Idempotency-Key'"
        AllowOrigin: "'*'"
      Description: BreatheSafe REST API
      # Caps abuse and cost on the public API.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
          MetricsEnabled: true
      # Write/draft routes opt in with Auth: Authorizer: CognitoAuth (ID token
      # in the Authorization header); read routes stay public.
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      # Errors produced by API Gateway itself (401 from the authorizer, 429
      # throttling, ...) need CORS headers too, or browsers hide them.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"

  # ============================================
  # DynamoDB Tables
  # ============================================
  AQIReadingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub breathesafe-aqi-readings-${Stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # The alert/decision audit trail is the product's core record: never let a
  # stack delete or replacement take it with it, and keep point-in-time backups.
  AlertsDecisionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub breathesafe-alerts-decisions-${Stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Only idempotency records carry TTL; alerts never expire.
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Recommendation bands as data (see backend/shared/src/rules.ts). Seed with
  # `npm run seed:rules --prefix backend -- --stage <stage>`; until then, and
  # whenever the stored set fails validation, the built-in rules are used.
  RulesConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub breathesafe-rules-config-${Stage}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ============================================
  # Domain events (EventBridge)
  # ============================================
  # Services publish what happened (aqi.reading.received, aqi.threshold.crossed,
  # alert.created, alert.decision.recorded); consumers subscribe with rules.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub breathesafe-${Stage}

  # Every event is kept for 30 days and can be replayed into the bus.
  EventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub breathesafe-${Stage}-events
      Description: All BreatheSafe domain events
      SourceArn: !GetAtt EventBus.Arn
      RetentionDays: 30
      EventPattern:
        source:
          - prefix: breathesafe.

  EventLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/events/breathesafe-${Stage}
      RetentionInDays: 14

  # Lets EventBridge write to the event log group.
  EventLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub breathesafe-${Stage}-events-to-logs
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"] },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${EventLogGroup}:*"
            }
          ]
        }

  EventLogRule:
    Type: AWS::Events::Rule
    DependsOn: EventLogPolicy
    Properties:
      Name: !Sub breathesafe-${Stage}-event-log
      Description: Writes every BreatheSafe event to CloudWatch Logs
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - prefix: breathesafe.
      Targets:
        - Id: event-log
          Arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${EventLogGroup}

  # ============================================
  # Alert delivery (email via SNS)
  # ============================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub breathesafe-alerts-${Stage}
      DisplayName: BreatheSafe

  # AWS emails a confirmation link to this address; delivery starts once it
  # is confirmed. Until then alerts are recorded as "email not configured".
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ============================================
  # Lambda Functions
  # ============================================
  FetchAQIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-fetch-aqi-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Current AQI for an area (Google Air Quality API), area list and nearest-area lookup
      LoggingConfig:
        LogGroup: !Ref FetchAQILogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RulesConfigTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        GetAQI:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/aqi/current
            Method: GET
        ListAreas:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/areas
            Method: GET
        NearestArea:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/areas/nearest
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/aqi-data/src/handler.ts
        External:
          - '@aws-sdk/*'

  GetRecommendationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-recommendation-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Timeout: 25
      Description: Evaluates an area's current AQI against the active ruleset; serves the ruleset and plan verdicts
      LoggingConfig:
        LogGroup: !Ref RecommendationLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RulesConfigTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        GetRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/recommendations/current
            Method: GET
        GetRules:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/rules
            Method: GET
        EvaluatePlans:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/plans/evaluate
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/recommendation/src/handler.ts
        External:
          - '@aws-sdk/*'

  AlertsCRUDFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-alerts-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Alert creation, decision recording, and history
      Environment:
        Variables:
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          NOTICE_URL: !Ref PublicSiteUrl
      LoggingConfig:
        LogGroup: !Ref AlertsLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt AlertsDecisionsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action:
                - sns:Publish
                - sns:ListSubscriptionsByTopic
              Resource: !Ref AlertsTopic
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RulesConfigTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        CreateAlert:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts
            Method: GET
        RecordDecision:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts/{alertId}/decision
            Method: PATCH
            Auth:
              Authorizer: CognitoAuth
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/alerts/src/handler.ts
        External:
          - '@aws-sdk/*'

  NoticesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-notices-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Bilingual notice drafts (reviewed templates + optional Gemini polish) and Polly audio
      Environment:
        Variables:
          NOTICE_AI_ENABLED: !Ref NoticeAIEnabled
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParam
      LoggingConfig:
        LogGroup: !Ref NoticesLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt AlertsDecisionsTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParam}
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*'
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RulesConfigTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        GetDraft:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/notices/draft
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        GetAudio:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/notices/audio
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/notices/src/handler.ts
        External:
          - '@aws-sdk/*'

  # Plain-language explanation of the current reading. Public, so output is
  # guardrail-checked, cached per reading and rate-limited (see the handler).
  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-explain-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Timeout: 25
      Description: Plain-language AQI explanations (Gemini with output guardrails; deterministic fallback)
      Environment:
        Variables:
          EXPLAIN_AI_ENABLED: !Ref ExplainAIEnabled
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParam
      LoggingConfig:
        LogGroup: !Ref ExplainLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParam}
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RulesConfigTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt EventBus.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        GetExplanation:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/explain
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/explain/src/handler.ts
        External:
          - '@aws-sdk/*'

  # ============================================
  # Trends & Scheduled Fetching
  # ============================================
  TrendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-trends-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: AQI trend for an area (Google Air Quality history or stored readings)
      LoggingConfig:
        LogGroup: !Ref TrendsLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleAqKeyParam}
      Events:
        GetTrends:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/trends
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/trends/src/handler.ts
        External:
          - '@aws-sdk/*'

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-auth-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Accounts - sign-up, verification, password reset, token refresh, profile, MFA setup, sign-out
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      # Only public Cognito client APIs (no IAM permissions). Sign-in itself
      # happens in the browser with SRP, directly against Cognito.
      LoggingConfig:
        LogGroup: !Ref AuthLogGroup
      Events:
        SignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/signup
            Method: POST
        ConfirmSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/confirm
            Method: POST
        RefreshToken:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/refresh
            Method: POST
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/profile
            Method: GET
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/forgot-password
            Method: POST
        ResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/reset-password
            Method: POST
        ResendCode:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/resend-code
            Method: POST
        SignOut:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/signout
            Method: POST
        MfaSetup:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/mfa/setup
            Method: POST
        MfaEnable:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/mfa/enable
            Method: POST
        MfaDisable:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/mfa/disable
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/auth/src/handler.ts
        External:
          - '@aws-sdk/*'

  # Adds the "custom:role" claim to every ID token Cognito issues (SRP
  # sign-in, MFA, refresh); the alert write routes require it.
  PreTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-pre-token-${Stage}
      CodeUri: ../backend/
      Handler: pre-token.handler
      Timeout: 5
      MemorySize: 128
      Description: Cognito Pre Token Generation trigger - role claim for alert write routes
      LoggingConfig:
        LogGroup: !Ref PreTokenLogGroup
      Events:
        PreTokenGeneration:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreTokenGeneration
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/auth/src/pre-token.ts
        External:
          - '@aws-sdk/*'

  # ============================================
  # Logs (14-day retention) and monitoring
  # ============================================
  # Functions log to these stack-managed groups instead of the default
  # /aws/lambda/... groups, so retention is controlled here.
  FetchAQILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/fetch-aqi
      RetentionInDays: 14

  RecommendationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/recommendation
      RetentionInDays: 14

  AlertsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/alerts
      RetentionInDays: 14

  NoticesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/notices
      RetentionInDays: 14

  TrendsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/trends
      RetentionInDays: 14

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/auth
      RetentionInDays: 14

  PreTokenLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/pre-token
      RetentionInDays: 14

  ExplainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/explain
      RetentionInDays: 14

  # Operational alarms -> email (same address as alert emails; AWS sends a
  # separate confirmation link for this topic).
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub breathesafe-ops-${Stage}
      DisplayName: BreatheSafe Ops

  OpsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-api-5xx
      AlarmDescription: API returned 5 or more server errors in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub breathesafe-api-${Stage}
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-lambda-throttles
      AlarmDescription: Lambda invocations were throttled (account concurrency limit)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FetchAQIErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-fetchaqi-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FetchAQIFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  RecommendationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-recommendation-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetRecommendationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  AlertsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-alerts-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlertsCRUDFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  NoticesErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-notices-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NoticesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  ExplainErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-explain-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExplainFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  AQIEndpoint:
    Description: AQI data endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/aqi/current
  RecommendationEndpoint:
    Description: Recommendation endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/recommendations/current
  AlertsEndpoint:
    Description: Alerts endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/alerts
  TrendsEndpoint:
    Description: AQI trends endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/trends
  NoticesEndpoint:
    Description: Notice draft endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/notices/draft
  ExplainEndpoint:
    Description: Plain-language explanation endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/explain
  RulesTableName:
    Description: DynamoDB RulesConfig table (recommendation bands)
    Value: !Ref RulesConfigTable
  EventBusName:
    Description: EventBridge bus for domain events
    Value: !Ref EventBus
  AlertsTopicArn:
    Description: SNS topic for alert emails
    Value: !Ref AlertsTopic
  OpsTopicArn:
    Description: SNS topic for operational alarms
    Value: !Ref OpsTopic
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  AQITableName:
    Description: DynamoDB AQI readings table
    Value: !Ref AQIReadingsTable
  AlertsTableName:
    Description: DynamoDB alerts/decisions table
    Value: !Ref AlertsDecisionsTable
