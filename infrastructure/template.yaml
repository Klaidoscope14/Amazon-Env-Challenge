AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BreatheSafe Campus - Air Quality Action Engine

Globals:
  Function:
    Runtime: nodejs22.x
    # API Gateway gives up at 29s; keep every function well below that.
    Timeout: 20
    MemorySize: 256
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        AQI_TABLE_NAME: !Ref AQIReadingsTable
        ALERTS_TABLE_NAME: !Ref AlertsDecisionsTable
        DATA_MODE: !Ref DataMode
        DEMO_SCENARIOS_ENABLED: !Ref DemoScenariosEnabled

Parameters:
  DataMode:
    Type: String
    Default: demo
    AllowedValues:
      - live
      - demo
    Description: "'live': nearest CPCB station for each area; 'demo': labelled fixtures for every request"
  CpcbApiKey:
    Type: String
    Default: 'none'
    NoEcho: true
    Description: data.gov.in API key for the CPCB real-time AQI feed (required for live mode)
  DemoScenariosEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: In live mode, allow presenter requests (?scenario=) to use labelled demo fixtures
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - dev
  AlertEmail:
    Type: String
    Default: ''
    Description: Email subscribed to alert notifications (SNS). Leave empty to disable email delivery.
  PublicSiteUrl:
    Type: String
    Default: ''
    Description: Public URL of the campus notice page, included in alert emails (e.g. https://example.com/notice). Optional.
  NoticeAIEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Polish notice drafts with the Gemini API (falls back to reviewed templates on any error)
  GeminiModel:
    Type: String
    Default: gemini-flash-lite-latest
    Description: Gemini model used for notice drafts
  GeminiApiKeyParam:
    Type: String
    Default: /breathesafe/gemini-api-key
    Description: SSM SecureString parameter holding the Gemini API key

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:

  # ============================================
  # Cognito User Pool
  # ============================================
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub breathesafe-users-${Stage}
      DeletionProtection: ACTIVE
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: institution
          AttributeDataType: String
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub breathesafe-web-${Stage}
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      # Attributes a user may set themselves (sign-up needs email). custom:role
      # is excluded so nobody can self-assign a role.
      WriteAttributes:
        - email
        - name
        - custom:institution
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ============================================
  # API Gateway
  # ============================================
  BreatheSafeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub breathesafe-api-${Stage}
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Description: BreatheSafe Campus REST API
      # Caps abuse and cost on the public API.
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40
          MetricsEnabled: true
      # Write/draft routes opt in with Auth: Authorizer: CognitoAuth (ID token
      # in the Authorization header); read routes stay public.
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      # Errors produced by API Gateway itself (401 from the authorizer, 429
      # throttling, ...) need CORS headers too, or browsers hide them.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ============================================
  # DynamoDB Tables
  # ============================================
  AQIReadingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub breathesafe-aqi-readings-${Stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # The alert/decision audit trail is the product's core record: never let a
  # stack delete or replacement take it with it, and keep point-in-time backups.
  AlertsDecisionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub breathesafe-alerts-decisions-${Stage}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ============================================
  # Alert delivery (email via SNS)
  # ============================================
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub breathesafe-alerts-${Stage}
      DisplayName: BreatheSafe Campus

  # AWS emails a confirmation link to this address; delivery starts once it
  # is confirmed. Until then alerts are recorded as "email not configured".
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ============================================
  # Lambda Functions
  # ============================================
  FetchAQIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-fetch-aqi-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Current AQI for an area (nearest CPCB station), area list and nearest-area lookup
      Environment:
        Variables:
          CPCB_API_KEY: !Ref CpcbApiKey
      LoggingConfig:
        LogGroup: !Ref FetchAQILogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
      Events:
        GetAQI:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/aqi/current
            Method: GET
        ListAreas:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/areas
            Method: GET
        NearestArea:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/areas/nearest
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/aqi-data/src/handler.ts
        External:
          - '@aws-sdk/*'

  # Pulls the full CPCB feed every 30 minutes into one compressed snapshot,
  # so API requests read a single item instead of calling CPCB.
  StationsRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-stations-refresh-${Stage}
      CodeUri: ../backend/
      Handler: refresh.handler
      Timeout: 60
      MemorySize: 512
      Description: Refreshes the CPCB station snapshot (live mode)
      Environment:
        Variables:
          CPCB_API_KEY: !Ref CpcbApiKey
      LoggingConfig:
        LogGroup: !Ref StationsRefreshLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt AQIReadingsTable.Arn
      Events:
        Every30Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)
            Description: Refresh CPCB station snapshot
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/aqi-data/src/refresh.ts
        External:
          - '@aws-sdk/*'

  GetRecommendationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-recommendation-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Timeout: 25
      Description: Evaluates an area's current AQI against CPCB rules
      Environment:
        Variables:
          CPCB_API_KEY: !Ref CpcbApiKey
      LoggingConfig:
        LogGroup: !Ref RecommendationLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
      Events:
        GetRecommendation:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/recommendations/current
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/recommendation/src/handler.ts
        External:
          - '@aws-sdk/*'

  AlertsCRUDFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-alerts-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Alert creation, decision recording, and history
      Environment:
        Variables:
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          NOTICE_URL: !Ref PublicSiteUrl
          CPCB_API_KEY: !Ref CpcbApiKey
      LoggingConfig:
        LogGroup: !Ref AlertsLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt AlertsDecisionsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action:
                - sns:Publish
                - sns:ListSubscriptionsByTopic
              Resource: !Ref AlertsTopic
      Events:
        CreateAlert:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts
            Method: GET
        RecordDecision:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/alerts/{alertId}/decision
            Method: PATCH
            Auth:
              Authorizer: CognitoAuth
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/alerts/src/handler.ts
        External:
          - '@aws-sdk/*'

  NoticesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-notices-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Bilingual notice drafts (reviewed templates + optional Gemini polish) and Polly audio
      Environment:
        Variables:
          NOTICE_AI_ENABLED: !Ref NoticeAIEnabled
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_API_KEY_PARAM: !Ref GeminiApiKeyParam
          CPCB_API_KEY: !Ref CpcbApiKey
      LoggingConfig:
        LogGroup: !Ref NoticesLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt AlertsDecisionsTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiApiKeyParam}
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*'
      Events:
        GetDraft:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/notices/draft
            Method: GET
            Auth:
              Authorizer: CognitoAuth
        GetAudio:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/notices/audio
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/notices/src/handler.ts
        External:
          - '@aws-sdk/*'

  # ============================================
  # Trends & Scheduled Fetching
  # ============================================
  TrendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-trends-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: AQI trend for an area (Open-Meteo hourly history or stored readings)
      LoggingConfig:
        LogGroup: !Ref TrendsLogGroup
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt AQIReadingsTable.Arn
      Events:
        GetTrends:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/trends
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/trends/src/handler.ts
        External:
          - '@aws-sdk/*'

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub breathesafe-auth-${Stage}
      CodeUri: ../backend/
      Handler: handler.handler
      Description: Authentication - signup, signin, user profile
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      # Public Cognito client APIs (SignUp, InitiateAuth, GetUser) need no IAM.
      # The admin API that assigns the server-controlled "admin" role does.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
      LoggingConfig:
        LogGroup: !Ref AuthLogGroup
      Events:
        SignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/signup
            Method: POST
        ConfirmSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/confirm
            Method: POST
        SignIn:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/signin
            Method: POST
        RefreshToken:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/refresh
            Method: POST
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BreatheSafeApi
            Path: /api/v1/auth/profile
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - services/auth/src/handler.ts
        External:
          - '@aws-sdk/*'

  # ============================================
  # Logs (14-day retention) and monitoring
  # ============================================
  # Functions log to these stack-managed groups instead of the default
  # /aws/lambda/... groups, so retention is controlled here.
  FetchAQILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/fetch-aqi
      RetentionInDays: 14

  StationsRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/stations-refresh
      RetentionInDays: 14

  RecommendationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/recommendation
      RetentionInDays: 14

  AlertsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/alerts
      RetentionInDays: 14

  NoticesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/notices
      RetentionInDays: 14

  TrendsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/trends
      RetentionInDays: 14

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /breathesafe/${Stage}/auth
      RetentionInDays: 14

  # Operational alarms -> email (same address as alert emails; AWS sends a
  # separate confirmation link for this topic).
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub breathesafe-ops-${Stage}
      DisplayName: BreatheSafe Ops

  OpsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-api-5xx
      AlarmDescription: API returned 5 or more server errors in 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub breathesafe-api-${Stage}
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-lambda-throttles
      AlarmDescription: Lambda invocations were throttled (account concurrency limit)
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  FetchAQIErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-fetchaqi-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FetchAQIFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  RecommendationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-recommendation-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetRecommendationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  AlertsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-alerts-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlertsCRUDFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

  NoticesErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub breathesafe-${Stage}-notices-errors
      AlarmDescription: Function errors (3 or more in 5 minutes)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NoticesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  AQIEndpoint:
    Description: AQI data endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/aqi/current
  RecommendationEndpoint:
    Description: Recommendation endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/recommendations/current
  AlertsEndpoint:
    Description: Alerts endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/alerts
  TrendsEndpoint:
    Description: AQI trends endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/trends
  NoticesEndpoint:
    Description: Notice draft endpoint
    Value: !Sub https://${BreatheSafeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/notices/draft
  AlertsTopicArn:
    Description: SNS topic for alert emails
    Value: !Ref AlertsTopic
  OpsTopicArn:
    Description: SNS topic for operational alarms
    Value: !Ref OpsTopic
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  AQITableName:
    Description: DynamoDB AQI readings table
    Value: !Ref AQIReadingsTable
  AlertsTableName:
    Description: DynamoDB alerts/decisions table
    Value: !Ref AlertsDecisionsTable
