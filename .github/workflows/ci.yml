# Checks every push and pull request. Deploys stay manual (sam deploy from a
# maintainer's machine), so this workflow needs no AWS credentials.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder stack settings: the build only needs them to be present.
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-south-1_CiPlaceholder
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ciplaceholderclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npx next build

  e2e:
    name: End-to-end — Playwright (mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  infrastructure:
    name: Infrastructure — validate & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      # SAM bundles each Lambda in a scratch copy with production dependencies
      # only, so esbuild must be on the PATH (same version as the lockfile).
      - name: Install esbuild for sam build
        run: npm install --global esbuild@0.28.2
      - name: Lint the SAM template
        run: sam validate --lint
        working-directory: infrastructure
      - name: Build every Lambda bundle
        run: sam build
        working-directory: infrastructure
